<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Favicons, generated from src/assets/logo.webp by scripts/generate-favicons.mjs.
      PNG rather than WebP because Safari does not reliably render WebP favicons.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Annual Dipawali Fundraising Program – Vedic Heritage Inc.</title>
    <meta
      name="description"
      content="An evening of Indian classical music with Rahul Deshpande, Tejas &amp; Rajas Upadhye, Milind Kulkarni and Amit Kavthekar. Saturday, October 24, 2026 at Pandit Jasraj Auditorium, Hempstead NY. Tickets $100, in support of the Sri Hanuman Mandir Brick by Brick project."
    />
    <meta name="theme-color" content="#e98314" />

    <!--
      REPLACE BEFORE LAUNCH: og:url, canonical and og:image must be absolute URLs
      on the real domain, or Facebook/WhatsApp/X will not render the share preview.
      Swap every occurrence of https://example.com for the live hostname.
    -->
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vedic Heritage Inc." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://example.com/" />
    <meta
      property="og:title"
      content="Annual Dipawali Fundraising Program – Vedic Heritage Inc."
    />
    <meta
      property="og:description"
      content="Saturday, October 24, 2026 · Pandit Jasraj Auditorium, Hempstead NY. An evening of Indian classical music in support of the Sri Hanuman Mandir Brick by Brick project."
    />
    <meta property="og:image" content="https://example.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sri Hanuman Mandir, Vedic Heritage Inc., Hempstead NY"
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Annual Dipawali Fundraising Program – Vedic Heritage Inc."
    />
    <meta
      name="twitter:description"
      content="Saturday, October 24, 2026 · Pandit Jasraj Auditorium, Hempstead NY. An evening of Indian classical music in support of the Sri Hanuman Mandir Brick by Brick project."
    />
    <meta name="twitter:image" content="https://example.com/og-image.jpg" />

    <!-- Google Fonts: warm up the connection before the CSS @import is parsed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Event structured data. Lets Google show the date, venue and ticket price
      directly in results and in the Google Events listings.
      2026-10-24 is EDT (UTC-4); US daylight saving does not end until Nov 1.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "Annual Dipawali Fundraising Program",
        "description": "An evening of Indian classical music, cultural heritage and community giving, in support of the Sri Hanuman Mandir Brick by Brick project.",
        "startDate": "2026-10-24T17:00:00-04:00",
        "eventStatus": "https://schema.org/EventScheduled",
        "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
        "image": "https://example.com/og-image.jpg",
        "location": {
          "@type": "Place",
          "name": "Pandit Jasraj Auditorium, Vedic Heritage Inc.",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "111 Jerusalem Ave",
            "addressLocality": "Hempstead",
            "addressRegion": "NY",
            "postalCode": "11550",
            "addressCountry": "US"
          }
        },
        "organizer": {
          "@type": "Organization",
          "name": "Vedic Heritage Inc.",
          "email": "vedic.heritageinc@gmail.com",
          "telephone": "+1-631-805-9105",
          "url": "https://example.com/"
        },
        "offers": {
          "@type": "Offer",
          "name": "General admission",
          "price": "100",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock",
          "url": "https://example.com/#tickets"
        },
        "performer": [
          { "@type": "Person", "name": "Rahul Deshpande" },
          { "@type": "Person", "name": "Tejas Upadhye" },
          { "@type": "Person", "name": "Rajas Upadhye" },
          { "@type": "Person", "name": "Milind Kulkarni" },
          { "@type": "Person", "name": "Amit Kavthekar" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
